function course(){let i=state.lesson,m=LESSONS[i];return '<div class="eyebrow">Учебный маршрут</div><h1>Программа инженера ИБ</h1><div class="grid two">'+card("Модули",LESSONS.map((x,j)=>'<button class="secondary" style="display:block;width:100%;text-align:left;margin:7px 0" data-lesson="'+j+'">'+(state.completed[j]?"✓ ":"")+String(j+1).padStart(2,"0")+' · '+safe(x[0])+'</button>').join(""))+card("Урок "+(i+1)+" · "+safe(m[0]),'<p>'+safe(m[1])+'</p><div class="ref"><b>Практика:</b> '+safe(m[2])+'</div><label class="field">Рабочие заметки<textarea id="lessonNotes">'+safe(state.notes[i]||"")+'</textarea></label>'+button("Сохранить заметки","saveNotes")+'<h3 class="space">Контрольный вопрос</h3><p>'+safe(m[3])+'</p>'+m[4].map((x,j)=>'<label style="display:block;margin:9px 0"><input type="radio" style="width:auto" name="lessonAnswer" value="'+j+'" '+(state.answers[i]===j?"checked":"")+'> '+safe(x)+'</label>').join("")+button("Проверить ответ","checkLesson","primary")+'<p id="lessonFeedback" aria-live="polite"></p>')+'</div>'}
function osi(){return '<div class="eyebrow">Интерактивная инженерная карта</div><h1>OSI · Семь уровней и контрольные меры</h1><p class="muted">Нажмите на уровень для просмотра угроз и защитных мер. Физическая безопасность, ОС, гипервизоры и процессы ИБ также рассматриваются отдельно, вне модели OSI.</p><div class="grid two">'+card("Стек OSI",'<div class="osi">'+OSI.map(x=>'<button data-osi="'+x[0]+'">L'+x[0]+' · '+x[1]+' <span class="muted">— '+x[2]+'</span></button>').join("")+'</div>')+card("Карточка уровня",'<div id="osiDetail"><p>Выберите уровень слева.</p></div>')+'</div>'}
function regulations(){let profile=state.system.profile;return '<div class="eyebrow">Нормативный конструктор</div><h1>Законодательство и требования</h1><div class="warning">Это справочный каталог. Точные пункты, редакции и применимость подлежат проверке. Поисковые ссылки не заменяют прямые ссылки на нормативные документы.</div><div class="grid two space">'+card("Профиль системы",'<label class="field">Выберите тип системы<select id="profileSelect">'+Object.entries(PROFILES).map(([k,v])=>'<option value="'+k+'" '+(k===profile?"selected":"")+'>'+v[0]+'</option>').join("")+'</select></label><p>Документы для проверки:</p>'+PROFILES[profile][1].map(x=>'<div class="ref">'+safe(x)+'</div>').join("")+'<p class="muted">ФСТЭК №17 хранится только для исторического сопоставления с №117.</p>')+card("Принцип трассировки",'<p>Документ → редакция → точный пункт → условие применимости → мера → актив → угроза → проверка → доказательство.</p><p>Пока связи представлены методикой, а не заполненным реестром точных пунктов.</p>')+'</div><div class="card"><h3>Каталог источников</h3><label class="field">Поиск<input id="docSearch" placeholder="Например, ФСТЭК, КИИ, БДУ"></label><div id="docList">'+docRows("")+'</div></div>'}
function docRows(q){return DOCS.filter(x=>x.join(" ").toLowerCase().includes(q.toLowerCase())).map(x=>'<div class="ref">'+link(x[2],x[0])+' — '+safe(x[1])+' <span class="pill">'+safe(x[3])+'</span></div>').join("")||'<p>Совпадений нет.</p>'}
function threats(){let all=CHECKS.flatMap(([domain,items],d)=>items.map((title,i)=>({id:"T"+String(d*10+i+1).padStart(3,"0"),domain,title})));return '<div class="eyebrow">Контрольные мероприятия</div><h1>Top-100 · Библиотека учебных проверок</h1><div class="warning">100 проверок — внутренний учебный чек-лист, не официальный рейтинг ФСТЭК. Для каждой проверки требуется уточнить применимость, конкретную угрозу БДУ, меру и метод испытания.</div><div class="grid two space">'+card("Структура",CHECKS.map(([d,items],i)=>'<div class="row between" style="border-bottom:1px solid #29405d;padding:7px 0"><span>'+safe(d)+'</span><span class="pill">'+items.length+' проверок</span></div>').join(""))+card("Методика угроз",'<p>Актив → нарушитель → сценарий → последствия → актуальность → мера → проверка.</p><p>'+link("https://bdu.fstec.ru/","БДУ ФСТЭК")+'</p><p>'+link("https://attack.mitre.org/","MITRE ATT&CK")+'</p><p>'+link("https://owasp.org/","OWASP")+'</p><p class="muted">Идентификаторы БДУ и точные нормативные пункты не выдумываются.</p>')+'</div><div class="card"><label class="field">Фильтр проверок<input id="checkSearch" placeholder="Например, журналирование, VLAN, доступ"></label><div id="checkList">'+checkRows(all,"")+'</div></div>'}
function checkRows(all,q){return '<table><thead><tr><th>ID</th><th>Домен</th><th>Контрольная проверка</th><th>Статус</th></tr></thead><tbody>'+all.filter(x=>(x.id+x.domain+x.title).toLowerCase().includes(q.toLowerCase())).map(x=>'<tr><td>'+x.id+'</td><td>'+safe(x.domain)+'</td><td>'+safe(x.title)+'</td><td class="muted">Не проверено</td></tr>').join("")+'</tbody></table>'}
function architect(){let s=state.system;return '<div class="eyebrow">Проектирование защищённых систем</div><h1>Конструктор архитектуры</h1><div class="grid two">'+card("Параметры объекта",'<label class="field">Название системы<input id="systemName" value="'+safe(s.system)+'"></label><label class="field">Нормативный профиль<select id="systemProfile">'+Object.entries(PROFILES).map(([k,v])=>'<option value="'+k+'" '+(k===s.profile?"selected":"")+'>'+v[0]+'</option>').join("")+'</select></label>'+button("Сохранить параметры","saveSystem","primary")+'<p class="muted">Профиль выбран для демонстрации; классификация должна быть обоснована отдельно.</p>')+card("Добавить актив",'<label class="field">Название<input id="assetName" placeholder="Например, сервер приложений"></label><label class="field">Тип узла<select id="assetType">'+Object.entries(NODETYPES).map(([k,v])=>'<option value="'+k+'">'+v[0]+'</option>').join("")+'</select></label>'+button("Добавить узел","addAsset","primary")+'</div><div class="card space"><div class="row between"><h3>Технические узлы и меры</h3>'+button("Скачать JSON","downloadSystem")+'</div><div class="grid" id="assetGrid">'+assetCards()+'</div></div><div class="card"><h3>Упрощённая схема потоков</h3><div class="flow">'+s.assets.map((a,i)=>'<span class="node">'+safe(a.name)+'</span>'+(i<s.assets.length-1?'<span class="arrow">→</span>':"")).join("")+'</div><p class="muted">Стрелки показывают только порядок элементов учебной схемы, а не подтверждённые сетевые соединения. Для реальной DFD нужны направления, протоколы, данные и границы доверия.</p></div>'}
function assetCards(){return state.system.assets.map((a,i)=>{let d=NODETYPES[a.type]||["Неизвестный тип","Не определён",[]];return '<div class="card"><div class="row between"><b>'+safe(a.name)+'</b><button class="secondary" data-remove="'+i+'" aria-label="Удалить узел">×</button></div><span class="pill">'+safe(d[0])+'</span><span class="pill">'+safe(d[1])+'</span><p>'+d[2].map(safe).join(" · ")+'</p></div>'}).join("")}
function auditPlan(){let s=state.system,p=PROFILES[s.profile];return {schema_version:"1.0-demo",mode:"PASSIVE",system:s.system,profile:p[0],regulations_to_verify:p[1],limitations:["План аудита, не результат проверки","Нет подтверждённой классификации и точных пунктов","Нет сканирования, проверки сертификатов или БДУ в реальном времени"],steps:["Подтвердить мандат и границы","Проверить реестр активов и потоки","Обосновать профиль и требования","Построить модель угроз","Проверить меры и сертификаты","Согласовать испытания","Собрать доказательства и провести ретест"],assets:s.assets.map((a,i)=>{let d=NODETYPES[a.type]||["Неизвестный тип","Не определён",[]];return {id:"A"+(i+1),name:a.name,type:d[0],osi:d[1],status:"NOT_TESTED",checks:d[2].map(t=>({title:t,status:"NOT_TESTED",evidence:null}))}})}}
function audit(){return '<div class="eyebrow">Алина · инженер ИБ</div><h1>Агент-планировщик аудита</h1><p class="muted">Работает локально по детерминированным правилам. Не использует LLM, не сканирует сеть, не проверяет сертификаты и не выдаёт заключение о соответствии.</p><div class="grid two">'+card("Режимы",'<div class="ref"><b>Passive</b> — документы, анкеты, архитектура</div><div class="ref"><b>Safe</b> — согласованные безопасные проверки</div><div class="ref"><b>VA</b> — разрешённое сканирование</div><div class="ref"><b>Active</b> — отдельное письменное разрешение</div><p class="warning">В прототипе доступно только планирование Passive.</p>')+card("Запуск",'<p>Система: <b>'+safe(state.system.system)+'</b></p><p>Активов: '+state.system.assets.length+'</p><p>Профиль: '+safe(PROFILES[state.system.profile][0])+'</p>'+button("Сформировать план","runAudit","primary")+' '+button("Экспорт JSON","exportAudit")+'</div>')+'</div><div class="card space"><h3>План аудита и контрольные мероприятия</h3><pre id="auditOutput">Нажмите «Сформировать план».</pre></div>'}
function lab(){return '<div class="eyebrow">Практический полигон</div><h1>Лабораторные работы</h1><div class="grid">'+["Инвентаризация медицинской ИС","Карта сетевых потоков и OSI","Определение нормативного профиля","Сценарии угроз для пяти активов","Проект сегментации и СЗИ","Проверка настроек без сканирования","Реестр рисков и отчёт","Итоговая защита проекта"].map((x,i)=>card("ЛР-"+String(i+1).padStart(2,"0"),'<p>'+safe(x)+'</p><span class="pill">Практика</span><p class="muted">Артефакт: схема, таблица или протокол с источниками и выводами.</p>'+button("Открыть урок","lab"+i))).join("")+'</div>'}
function evidence(){return '<div class="eyebrow">Доказательная инженерия</div><h1>Реестр результатов и доказательств</h1><p class="muted">Фиксируйте факты, а не предположения. Данные хранятся только в браузере.</p><div class="grid two">'+card("Новая запись",'<label class="field">Узел<input id="evAsset" placeholder="АРМ врача"></label><label class="field">Проверка<input id="evCheck" placeholder="Проверка журналирования"></label><label class="field">Статус<select id="evStatus"><option>NOT_TESTED</option><option>UNKNOWN</option><option>PASS</option><option>FAIL</option><option>PARTIAL</option><option>NOT_APPLICABLE</option></select></label><label class="field">Источник / доказательство<textarea id="evProof" placeholder="Путь к протоколу, дата, автор; не вводите секреты"></textarea></label>'+button("Сохранить запись","addEvidence","primary"))+card("Критерии качества",'<p>PASS возможен только при наличии фактического подтверждения.</p><p>UNKNOWN и NOT_TESTED не считаются успешными.</p><p>Отчёт об аудите не равен официальной аттестации.</p>'+button("Экспорт реестра","exportEvidence")+'</div>')+'</div><div class="card space"><h3>Записи</h3><div id="evidenceRows">'+evidenceRows()+'</div></div>'}
function evidenceRows(){return (state.audit.entries||[]).length?'<table><thead><tr><th>Узел</th><th>Проверка</th><th>Статус</th><th>Доказательство</th></tr></thead><tbody>'+state.audit.entries.map(x=>'<tr><td>'+safe(x.asset)+'</td><td>'+safe(x.check)+'</td><td>'+safe(x.status)+'</td><td>'+safe(x.proof)+'</td></tr>').join("")+'</tbody></table>':'<p class="muted">Записей пока нет.</p>'}
function resources(){return '<div class="eyebrow">Первоисточники и границы автоматизации</div><h1>Источники и статус платформы</h1><div class="grid two">'+card("Нормативные источники",DOCS.map(x=>'<p>'+link(x[2],x[0])+' — '+safe(x[1])+'</p>').join(""))+card("Статус функций",'<p class="ok">✓ Учебные модули, тесты, локальный прогресс</p><p class="ok">✓ Интерактивная OSI, Top-100, конструктор узлов</p><p class="ok">✓ План аудита и реестр доказательств</p><p class="bad">○ Проверенная постатейная база ФСТЭК — ещё не загружена</p><p class="bad">○ Интеграция БДУ и реестра сертификатов — ещё не подключена</p><p class="bad">○ Авторизация, серверная БД, LLM и API — ещё не подключены</p><p class="bad">○ Полноценные DFD, контрольные испытания и отчёты — ещё не реализованы</p><p class="muted">Данные остаются в localStorage текущего браузера; не вводите реальные ПДн и секреты.</p>')+'</div>'}
function download(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bind(){const on=(id,fn)=>{let n=el(id);if(n)n.onclick=fn};on("goArchitect",()=>render("architect"));on("goAudit",()=>render("audit"));document.querySelectorAll("[data-lesson]").forEach(n=>n.onclick=()=>{state.lesson=+n.dataset.lesson;save();render("course")});on("saveNotes",()=>{state.notes[state.lesson]=el("lessonNotes").value;save();alert("Заметки сохранены локально")});on("checkLesson",()=>{let chosen=document.querySelector('input[name="lessonAnswer"]:checked');if(!chosen){el("lessonFeedback").textContent="Выберите ответ";return}let answer=+chosen.value;state.answers[state.lesson]=answer;if(answer===LESSONS[state.lesson][5]){state.completed[state.lesson]=true;el("lessonFeedback").textContent="Верно. Контрольный вопрос зачтён.";save()}else{el("lessonFeedback").textContent="Неверно. Изучите тему и повторите попытку.";save()}});document.querySelectorAll("[data-osi]").forEach(n=>n.onclick=()=>{let x=OSI.find(v=>v[0]===n.dataset.osi);el("osiDetail").innerHTML='<h3>L'+x[0]+' · '+x[1]+'</h3><p><b>Технологии:</b> '+x[2]+'</p><p><b>Примеры угроз:</b> '+x[3]+'</p><p><b>Меры:</b> '+x[4]+'</p><p class="muted">Меры уточняются по профилю и модели угроз.</p>'});on("profileSelect",()=>{});if(el("profileSelect"))el("profileSelect").onchange=e=>{state.system.profile=e.target.value;save();render("regulations")};if(el("docSearch"))el("docSearch").oninput=e=>el("docList").innerHTML=docRows(e.target.value);if(el("checkSearch")){let all=CHECKS.flatMap(([domain,items],d)=>items.map((title,i)=>({id:"T"+String(d*10+i+1).padStart(3,"0"),domain,title})));el("checkSearch").oninput=e=>el("checkList").innerHTML=checkRows(all,e.target.value)}on("saveSystem",()=>{state.system.system=el("systemName").value.trim()||"Без названия";state.system.profile=el("systemProfile").value;save();render("architect")});on("addAsset",()=>{let name=el("assetName").value.trim();if(!name)return alert("Укажите название узла");state.system.assets.push({name,type:el("assetType").value});save();render("architect")});document.querySelectorAll("[data-remove]").forEach(n=>n.onclick=()=>{state.system.assets.splice(+n.dataset.remove,1);save();render("architect")});on("downloadSystem",()=>download(state.system,"cybered_system.json"));on("runAudit",()=>el("auditOutput").textContent=JSON.stringify(auditPlan(),null,2));on("exportAudit",()=>download(auditPlan(),"cybered_audit_plan.json"));for(let i=0;i<8;i++)on("lab"+i,()=>{state.lesson=i;render("course")});on("addEvidence",()=>{let asset=el("evAsset").value.trim(),check=el("evCheck").value.trim(),proof=el("evProof").value.trim(),status=el("evStatus").value;if(!asset||!check)return alert("Укажите узел и проверку");if(status==="PASS"&&!proof)return alert("Для PASS необходимо доказательство");(state.audit.entries??=[]).push({asset,check,status,proof,created_at:new Date().toISOString()});save();render("evidence")});on("exportEvidence",()=>download(state.audit.entries||[],"cybered_evidence.json"))}
render(NAV.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):"dashboard");
</script></body></html>
