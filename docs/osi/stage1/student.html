<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberED — Инженерия ИБ</title><style>
:root{font-family:Inter,system-ui,Arial;background:#0b1220;color:#eaf2ff}*{box-sizing:border-box}body{margin:0}header{padding:24px 4%;background:#121f35;border-bottom:1px solid #304560}header h1{margin:0;font-size:27px}header p{color:#9eb4d0}main{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 115px)}nav{padding:20px;border-right:1px solid #304560}nav button{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid #304560;border-radius:10px;background:#16243b;color:#eaf2ff;cursor:pointer}nav button.active{border-color:#53bce7;background:#173d59}article{padding:28px;max-width:1050px}h2{margin-top:0}h3{color:#8ad5fb}.muted{color:#a9b9cf}.card{background:#15243a;border:1px solid #2d4863;padding:18px;border-radius:12px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tag{display:inline-block;border:1px solid #4e708d;border-radius:99px;padding:4px 9px;color:#bde9ff;font-size:12px;margin:3px}button.action{background:#1475a5;color:white;border:0;padding:10px 15px;border-radius:8px;cursor:pointer}input,select,textarea{background:#0c1b2f;color:white;border:1px solid #49617e;border-radius:7px;padding:9px;max-width:100%}label{display:block;margin:10px 0}.steps{line-height:1.9}a{color:#8bd8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1728;padding:14px;border-radius:8px}details{padding:12px;background:#172a43;margin:10px 0;border-radius:8px}summary{cursor:pointer}#score{font-weight:700;color:#9ff1d1}@media(max-width:750px){main{display:block}nav{border-right:0;border-bottom:1px solid #304560}article{padding:17px}}</style>
<header><h1>CyberED / FATHER · Инженерия информационной безопасности</h1><p>Ступень 1 · Изучение → обследование → угрозы → требования → архитектура → аудит → доказательства</p><span class="tag">Учебный прототип</span><span class="tag">Без подключения к реестрам в реальном времени</span><span class="tag" id="score">Прогресс: 0/8</span></header>
<main><nav id="nav"></nav><article id="content"></article></main>
<script>
const modules=[
{id:"intro",title:"00 · Маршрут инженера",goal:"Научиться проводить полный цикл проектирования защиты.",theory:["Система защиты начинается с объекта, границ, владельцев и информации.","Сначала классификация и применимые требования, затем угрозы и архитектура. OSI помогает привязать технические меры к сетевым узлам, но не определяет юридическую применимость.","Для каждого вывода нужны источник, редакция, пункт, тест и доказательство."],practice:"Опишите учебную ИС: владельца, назначение, данные, серверы, пользователей и внешние подключения.",check:"Что должно быть определено до подбора СЗИ?",answers:["Марка межсетевого экрана","Границы, данные, требования и угрозы","Только уровень OSI"],correct:1},
{id:"assets",title:"01 · Обследование и активы",goal:"Построить реестр активов и карту потоков.",theory:["Соберите АРМ, серверы, коммутаторы, гипервизоры, ПО, сервисы, учётные записи, хранилища и резервные копии.","Для потока укажите источник, получатель, протокол, данные, направление, основание и доверенную границу.","Неизвестный узел фиксируется как пробел обследования, а не как доказанное нарушение."],practice:"Составьте список из пяти активов и трёх информационных потоков.",check:"Какой атрибут обязателен для критичного потока?",answers:["Цвет кабеля","Источник, получатель, данные и протокол","Цена коммутатора"],correct:1},
{id:"osi",title:"02 · OSI и границы доверия",goal:"Связать узлы и сетевые угрозы.",theory:["L1 — кабель и среда; L2 — Ethernet/VLAN; L3 — IP/маршрутизация; L4 — TCP/UDP; L5–L7 — сеансы, представление, приложения.","ОС, физический контроль, учётные записи и управление процессами защиты не помещаются целиком в один уровень OSI.","Сегментация, межсетевые экраны, защита коммутаторов и контроль сервисов выбираются по потокам и угрозам."],practice:"Нарисуйте две зоны доверия и подпишите правила между ними.",check:"Где в первую очередь рассматривают VLAN?",answers:["L2","L7","Только вне OSI"],correct:0},
{id:"rules",title:"03 · Нормативные профили",goal:"Разделить ИСПДн, ГИС и КИИ.",theory:["ИСПДн: 152-ФЗ, ПП №1119, приказ ФСТЭК №21 по применимости.","ГИС и охватываемые приказом системы: приказ ФСТЭК №117 от 11.04.2025 в действующей редакции. №17 — исторический документ.","Значимые объекты КИИ: 187-ФЗ, приказы №235/239 по применимости. Криптографические средства рассматриваются с учётом актов ФСБ.","Для каждого требования обязательны редакция, пункт, условие применимости и статус проверки."],practice:"Для учебной ИСПДн перечислите документы и условия, от которых зависит выбор мер.",check:"Можно ли применять все приказы ФСТЭК к любой системе?",answers:["Да","Нет, нужна проверка применимости","Только по желанию студента"],correct:1},
{id:"threats",title:"04 · Модель угроз",goal:"От угроз перейти к проверяемым мерам.",theory:["Используйте Методику оценки угроз ФСТЭК 2021 и БДУ как нормативно-методическую опору.","Различайте угрозу, уязвимость, технику атаки и реализовавшийся инцидент.","Для сценария фиксируйте актив, нарушителя, возможность реализации, последствия, актуальность и меры."],practice:"Составьте три сценария: для L2, сервера и приложения. Добавьте актив, последствия и контроль.",check:"Что такое БДУ?",answers:["Каталог угроз и уязвимостей ФСТЭК","Список обязательных брендов СЗИ","Замена модели угроз"],correct:0},
{id:"architecture",title:"05 · Архитектура ИБ",goal:"Построить систему защитных зон.",theory:["Проектируйте физическую, сетевую, вычислительную, прикладную защиту, IAM, криптографию, мониторинг и восстановление.","Каждая актуальная угроза должна быть связана с мерой и планом проверки.","Сертификат СЗИ проверяют для конкретной версии, комплектации, области действия и ограничений."],practice:"Сформируйте схему: интернет → периметр → DMZ → серверная зона → БД; подпишите меры и журналы.",check:"Что подтверждает сертификат СЗИ?",answers:["Автоматическую защищённость всей ИС","Свойства конкретного продукта в области сертификата","Отсутствие всех уязвимостей"],correct:1},
{id:"audit",title:"06 · Инженерный аудит",goal:"Провести проверку без потери доказательств.",theory:["Маршрут: мандат → инвентаризация → классификация → требования → угрозы → меры → проверки → риски → отчёт → ретест.","Passive — документы; Safe — безопасные проверки; VA — разрешённое сканирование; Active — только отдельное письменное согласование.","Статусы PASS, FAIL, PARTIAL, UNKNOWN, NOT_TESTED, NOT_APPLICABLE; неизвестное не равно успеху."],practice:"Заполните три карточки аудита с доказательствами и ответственными.",check:"Что означает отсутствие доказательств выполнения меры?",answers:["PASS","UNKNOWN / NOT_TESTED","Автоматически FAIL"],correct:1},
{id:"final",title:"07 · Итоговый проект",goal:"Защитить учебную информационную систему.",theory:["Соберите паспорт ИС, DFD, классификацию, требования, модель угроз, архитектуру, кандидатов СЗИ, план испытаний и реестр рисков.","Top-100 — внутренний каталог проверок, а не обязательный норматив ФСТЭК.","Алина помогает готовить материалы; студент и проверяющий подтверждают обоснования."],practice:"Подготовьте архитектурный пакет для учебной медицинской ИС и обоснуйте минимум пять мер.",check:"Когда можно считать внедрение завершённым?",answers:["После красивой схемы","После выбора бренда","После подтверждённых сквозных испытаний"],correct:2}
];
const references=[["БДУ ФСТЭК","https://bdu.fstec.ru/"],["Реестр сертифицированных СЗИ ФСТЭК","https://reestr.fstec.ru/"],["Приказ ФСТЭК №117","https://publication.pravo.gov.ru/document/0001202506170011"],["152-ФЗ","https://www.consultant.ru/document/cons_doc_LAW_61801/"],["187-ФЗ","https://www.consultant.ru/document/cons_doc_LAW_220885/"],["ГОСТ Р ИСО/МЭК 7498-1-99","https://protect.gost.ru/gost/details/5985f998-dddc-409c-abc3-53069b5e1484"]];
let done={};try{done=JSON.parse(localStorage.getItem("cybered_stage1_progress")||"{}")}catch(e){}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function show(id){const m=modules.find(x=>x.id===id)||modules[0];document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===m.id));document.getElementById("content").innerHTML='<h2>'+esc(m.title)+'</h2><p class="muted">'+esc(m.goal)+'</p><div class="grid">'+m.theory.map((t,i)=>'<div class="card"><h3>Тема '+(i+1)+'</h3><p>'+esc(t)+'</p></div>').join("")+'</div><div class="card"><h3>Практическое задание</h3><p>'+esc(m.practice)+'</p><label>Рабочие заметки студента<textarea id="notes" rows="5" style="width:100%" placeholder="Результаты, источники, ссылки на доказательства"></textarea></label><button class="action" id="save">Сохранить заметки</button></div><div class="card"><h3>Контроль знаний</h3><p>'+esc(m.check)+'</p>'+m.answers.map((a,i)=>'<label><input type="radio" name="quiz" value="'+i+'"> '+esc(a)+'</label>').join("")+'<button class="action" id="check">Проверить</button><p id="feedback" aria-live="polite"></p></div><div class="card"><h3>Источники и учебные материалы</h3>'+references.map(([name,url])=>'<p><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+esc(name)+'</a></p>').join("")+'<p class="muted">Точные пункты и редакции требуют отдельной верификации. Общий перечень не означает применимость каждого акта.</p></div>';document.getElementById("notes").value=localStorage.getItem("cybered_notes_"+id)||"";document.getElementById("save").onclick=()=>{localStorage.setItem("cybered_notes_"+id,document.getElementById("notes").value);alert("Заметки сохранены в этом браузере")};document.getElementById("check").onclick=()=>{const v=document.querySelector('input[name="quiz"]:checked');const f=document.getElementById("feedback");if(!v){f.textContent="Выберите ответ";return}if(Number(v.value)===m.correct){done[id]=true;localStorage.setItem("cybered_stage1_progress",JSON.stringify(done));f.textContent="Верно. Тема зачтена по контрольному вопросу.";progress()}else f.textContent="Пока неверно. Перечитайте материал и повторите попытку."};history.replaceState(null,"","#"+id)}
function progress(){document.getElementById("score").textContent="Прогресс: "+modules.filter(m=>done[m.id]).length+"/"+modules.length}
document.getElementById("nav").innerHTML=modules.map(m=>'<button data-id="'+m.id+'">'+esc(m.title)+'</button>').join("")+'<p class="muted">Результаты сохраняются только в браузере. Проверка одного вопроса не заменяет практическую аттестацию.</p>';document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.id));progress();show(location.hash.slice(1)||"intro");
</script></html>
