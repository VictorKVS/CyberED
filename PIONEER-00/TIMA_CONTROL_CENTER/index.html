<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIMA Control Center</title><style>body{background:#0d1727;color:#edf4ff;font:16px system-ui;margin:0;padding:30px}main{max-width:1050px;margin:auto}button,a{background:#27b7a1;color:#07191b;padding:12px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}section{background:#17263b;padding:20px;border-radius:12px;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#cbd7e9}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}h1{margin-bottom:4px}small{color:#a9bcd4}</style></head><body><main><h1>TIMA / Control Center</h1><p>Паспорт компьютера · пассивная диагностика · localhost</p><section><button id="start">1 · Запустить обследование</button> <a href="/api/report" id="download" hidden download="inventory.json">Скачать JSON</a><p id="status">Ожидание</p><small>Отчёты остаются локально. В GitHub отправляйте только проверенные обезличенные сведения.</small></section><div id="cards"></div></main><script>
const statusEl=document.getElementById('status'),cards=document.getElementById('cards'),btn=document.getElementById('start'),dl=document.getElementById('download');
btn.onclick=async()=>{btn.disabled=true;try{const r=await fetch('/api/scan',{method:'POST',headers:{'Content-Length':'0'}});if(!r.ok)throw Error(await r.text());}catch(e){statusEl.textContent=e.message;btn.disabled=false}};
async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();statusEl.textContent='Статус: '+s.status+(s.current?' · '+s.current:'')+(s.error?' · '+s.error:'');btn.disabled=s.status==='running';dl.hidden=!s.report;cards.replaceChildren();for(const [key,value] of Object.entries(s.results||{})){const section=document.createElement('section'),h=document.createElement('h3'),pre=document.createElement('pre');h.textContent=key;pre.textContent=JSON.stringify(value,null,2);section.append(h,pre);cards.append(section)}}catch(e){statusEl.textContent=e.message}}refresh();setInterval(refresh,2000);
</script></body></html>
