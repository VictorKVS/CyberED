<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIMA · Диспетчер диагностики</title>
<style>body{background:#0d1727;color:#edf4ff;font:15px system-ui;margin:0;padding:28px}main{max-width:1100px;margin:auto}h1{margin:0}p,small{color:#a9bcd4}section{background:#17263b;padding:20px;border-radius:12px;margin:16px 0}button,a{background:#27b7a1;color:#07191b;padding:10px 14px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600}button:disabled{opacity:.45;cursor:default}.secondary{background:#263b58;color:#e2f1ff}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.card{background:#17263b;border:1px solid #31445f;border-radius:12px;padding:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:20px;background:#30405a;font-size:12px}.running{background:#735321}.ok{background:#166553}.error,.timeout{background:#783640}.unavailable{background:#5d4c26}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font-size:11px;color:#cbd7e9}progress{width:100%;height:16px;accent-color:#27b7a1}#notice{color:#f2c66d}</style></head><body><main><h1>TIMA / Control Center</h1><p>Диспетчер обследования компьютера · localhost · v0.2</p>
<section><div class="row"><button id="start">▶ Запустить полное обследование</button><button id="refresh" class="secondary">↻ Обновить состояние</button><a href="/api/report" id="download" hidden download="inventory.json">↓ JSON-отчёт</a></div><p id="status">Загрузка...</p><progress id="progress" value="0" max="1"></progress><p id="count">0 / 0</p><small>Активного сетевого сканирования нет. Сырые отчёты сохраняются только локально.</small><p id="notice"></p></section>
<h2>Модули обследования</h2><div id="cards"></div></main><script>
const names={hardware:"Процессор и память",windows:"Windows",disks:"Диски и свободное место",software:"Установленные программы",aida64:"AIDA64 — обнаружение",docker:"Docker Engine",containers:"Контейнеры",wsl:"WSL2",virtualization:"Виртуализация",adapters:"Сетевые адаптеры",network:"Локальная IP-конфигурация"};
const labels={pending:"Ожидает",running:"Выполняется",ok:"Готово",error:"Ошибка",timeout:"Таймаут",unavailable:"Недоступно"};
const statusEl=document.getElementById("status"),cards=document.getElementById("cards"),start=document.getElementById("start"),dl=document.getElementById("download"),notice=document.getElementById("notice");
let busy=false;
async function launch(module){if(busy)return;notice.textContent="";try{const url="/api/scan"+(module?"?module="+encodeURIComponent(module):"");const r=await fetch(url,{method:"POST"});if(!r.ok)throw Error(await r.text());await refresh()}catch(e){notice.textContent="Не удалось запустить: "+e.message}}
async function refresh(){try{const r=await fetch("/api/status");if(!r.ok)throw Error("HTTP "+r.status);const s=await r.json();busy=s.status==="running";start.disabled=busy;dl.hidden=!s.report;statusEl.textContent="Состояние: "+({idle:"Ожидание",running:"Обследование выполняется",complete:"Обследование завершено",failed:"Ошибка"}[s.status]||s.status)+(s.current?" · Сейчас: "+(names[s.current]||s.current):"");const total=s.total||0,completed=s.completed||0;document.getElementById("progress").max=Math.max(1,total);document.getElementById("progress").value=completed;document.getElementById("count").textContent=completed+" / "+total+" проверок";cards.replaceChildren();for(const [key,label] of Object.entries(names)){const state=s.modules?.[key]||"pending",res=s.results?.[key];const card=document.createElement("article");card.className="card";const top=document.createElement("div");top.className="row";const title=document.createElement("strong");title.textContent=label;const badge=document.createElement("span");badge.className="badge "+state;badge.textContent=labels[state]||state;top.append(title,badge);const btn=document.createElement("button");btn.className="secondary";btn.textContent="▶ Проверить модуль";btn.disabled=busy;btn.onclick=()=>launch(key);card.append(top,document.createElement("p"),btn);if(res){const pre=document.createElement("pre");pre.textContent=JSON.stringify(res,null,2);card.append(pre)}cards.append(card)}if(s.error)notice.textContent=s.error}catch(e){statusEl.textContent="Ошибка связи: "+e.message}}
start.onclick=()=>launch();document.getElementById("refresh").onclick=refresh;refresh();setInterval(refresh,1500);
</script></body></html>
